name: Build

# Every push to main: run the headless playtest, build the Windows .exe and the itch.io web zip,
# and attach them to the run as downloadable artifacts.
# Pushing a tag like v1.2.0 also creates a GitHub Release with both files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pygame pyinstaller pygbag

      - name: Headless playtest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python playtest_headless.py

      - name: Build Windows exe
        run: python tools/build_exe.py

      - name: Build web (itch.io) zip
        run: python tools/build_web.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gun-designer-${{ github.sha }}
          path: |
            dist/GunDesigner.exe
            dist/gundesigner_web.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GunDesigner.exe
            dist/gundesigner_web.zip
