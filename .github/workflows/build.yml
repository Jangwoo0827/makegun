name: Build

# Every push to main: run the headless playtest, build the Windows .exe and the web zip,
# and attach them to the run as downloadable artifacts.
# Pushing a tag like v1.2.0 also creates a GitHub Release with both files.
# Pushes to main also publish the web build to GitHub Pages (https://jangwoo0827.github.io/makegun/).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pygame pyinstaller pygbag

      - name: Headless playtest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python playtest_headless.py

      - name: Build Windows exe
        run: python tools/build_exe.py

      - name: Build web zip
        run: python tools/build_web.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gun-designer-${{ github.sha }}
          path: |
            dist/GunDesigner.exe
            dist/gundesigner_web.zip

      - name: Upload Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web_stage/gundesigner/build/web

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GunDesigner.exe
            dist/gundesigner_web.zip

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
